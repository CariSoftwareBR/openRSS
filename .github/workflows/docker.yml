name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Reconstrói semanalmente para a imagem publicada receber patches do Node/Debian mesmo sem commits.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # A imagem só é publicada se subir e responder no /api/health.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: openrss:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the container and wait for /api/health
        run: |
          docker run -d --name openrss -p 8285:3000 -e DATABASE_URL=file:/data/openrss.db openrss:smoke
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8285/api/health | tee /tmp/health.json | grep -q '"status":"ok"'; then
              cat /tmp/health.json; exit 0
            fi
            sleep 2
          done
          docker logs openrss
          exit 1

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # arm64 (Raspberry Pi, Umbrel, CasaOS/ZimaBoard) é construído via emulação.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
            # v0.1.1 → 0.1.1 e 0.1: as lojas de apps (Umbrel, CasaOS) fixam versões sem o "v".
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
