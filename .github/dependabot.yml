version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # These packages share types. Separate bumps nest a second copy of `ai`
      # and break `tsc` on UIMessage.
      ai-sdk:
        patterns:
          - "ai"
          - "@ai-sdk/*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
