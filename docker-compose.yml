# openRSS — um único container. Na primeira visita, o assistente pergunta qual banco usar
# (SQLite ou PostgreSQL). Config, segredo e o banco SQLite ficam no volume "openrss-data".
#   docker compose up -d --build
services:
  openrss:
    build:
      context: .
      # Baixa a imagem base mais recente a cada build (patches de segurança do Node/Debian).
      pull: true
    image: openrss:${OPENRSS_IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "8285:3000"
    environment:
      # Opcional: se vazio, é gerado no primeiro boot e salvo em /data/config.json.
      APP_SECRET: ${APP_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8285}
      # Opcional: defina para pular o assistente (ex.: postgresql://user:pass@host:5432/openrss).
      DATABASE_URL: ${DATABASE_URL:-}
      ALLOW_PRIVATE_FEEDS: ${ALLOW_PRIVATE_FEEDS:-false}
      ALLOW_PRIVATE_WEBHOOKS: ${ALLOW_PRIVATE_WEBHOOKS:-false}
      # Login único (opcional): veja a tabela de variáveis no README.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_AUTO_REGISTER: ${OIDC_AUTO_REGISTER:-}
      OIDC_DISABLE_PASSWORD_LOGIN: ${OIDC_DISABLE_PASSWORD_LOGIN:-}
      # E-mail (opcional): redefinição de senha e digest por e-mail.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      DISABLE_SCHEDULER: ${DISABLE_SCHEDULER:-false}
      # Cópia semanal do SQLite em /data/backups (mantém as 3 últimas).
      OPENRSS_SQLITE_BACKUP: ${OPENRSS_SQLITE_BACKUP:-false}
      # Aviso de nova versão para admins (consulta as releases do GitHub a cada 12 h).
      OPENRSS_UPDATE_CHECK: ${OPENRSS_UPDATE_CHECK:-true}
      # Botão "Atualizar agora": webhook que baixa a imagem nova e reinicia (ex.: Watchtower abaixo).
      OPENRSS_UPDATE_WEBHOOK_URL: ${OPENRSS_UPDATE_WEBHOOK_URL:-}
      OPENRSS_UPDATE_WEBHOOK_TOKEN: ${OPENRSS_UPDATE_WEBHOOK_TOKEN:-}
    volumes:
      - openrss-data:/data

  # Atualização com um clique (opcional). Use a imagem publicada no lugar do build local
  # (image: ghcr.io/carisoftwarebr/openrss:latest) e defina no .env:
  #   OPENRSS_UPDATE_WEBHOOK_URL=http://watchtower:8080/v1/update
  #   OPENRSS_UPDATE_WEBHOOK_TOKEN=<um segredo qualquer>
  # watchtower:
  #   image: nickfedor/watchtower
  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   environment:
  #     WATCHTOWER_HTTP_API_UPDATE: "true"
  #     WATCHTOWER_HTTP_API_TOKEN: ${OPENRSS_UPDATE_WEBHOOK_TOKEN}
  #     WATCHTOWER_LABEL_ENABLE: "true"
  # E no serviço openrss:
  #   labels:
  #     - com.centurylinklabs.watchtower.enable=true

volumes:
  openrss-data:
